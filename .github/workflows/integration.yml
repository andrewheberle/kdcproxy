name: integration

# MIT krb5 clients against the KKDCP server and a Samba AD DC; see test/integration
on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'test/integration/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run integration tests
        run: go test -tags integration -timeout 15m -v ./test/integration/

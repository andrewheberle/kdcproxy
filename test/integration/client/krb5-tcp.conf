# MIT client that can only reach the realm through kdcproxy-tcp
[libdefaults]
	default_realm = EXAMPLE.TEST
	dns_lookup_kdc = false
	dns_lookup_realm = false
	rdns = false

[realms]
	EXAMPLE.TEST = {
		kdc = https://kdcproxy-tcp:8443/KdcProxy
		kpasswd_server = https://kdcproxy-tcp:8443/KdcProxy
		http_anchors = FILE:/run/kdcproxy/ca.pem
	}
